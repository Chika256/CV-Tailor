name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - name: Type-check (mypy --strict, all three platforms)
        run: |
          for platform in linux darwin win32; do
            mypy --platform "$platform"
          done

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install -e ".[dev]"
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check the installed command
        run: cv-tailor --version

  libreoffice:
    name: LibreOffice renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Carlito is metric-compatible with Calibri, the sample CV's font, so pagination matches Word.
      - name: Install LibreOffice Writer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - name: Render the sample CV with LibreOffice
        env:
          CV_TAILOR_REQUIRE_LIBREOFFICE: "1"
        run: python -m unittest tests.test_render -v

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check script syntax
        run: for file in extension/*.js tests/*.mjs; do node --check "$file"; done
      - name: Check the manifest
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync("extension/manifest.json", "utf8"));
            if (m.manifest_version !== 3) throw new Error("manifest_version must be 3");
            if (!/^\d+\.\d+\.\d+$/.test(m.version)) throw new Error(`bad version: ${m.version}`);
            const hosts = m.host_permissions || [];
            if (hosts.some((h) => !h.startsWith("http://127.0.0.1"))) throw new Error(`non-loopback host permission: ${hosts}`);
          '
      - name: Run unit tests
        run: node --test tests/*.test.mjs
